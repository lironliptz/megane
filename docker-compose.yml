services:
  app:
    build: .
    env_file: .env
    expose:
      - "8080"
    volumes:
      - ./projects:/app/projects
      - ./.db:/app/.db
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
      PORT: ${PORT:-8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
