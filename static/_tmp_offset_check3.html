<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>offset check 3</title>
  <script src="/static/js/chart.umd.min.js"></script>
</head>
<body>
  <div style="width: 800px">
    <canvas id="c1" height="100"></canvas>
    <canvas id="c2" height="100"></canvas>
  </div>
  <pre id="out"></pre>
  <script>
    const labels = [];
    for (let i = 0; i < 100; i++) labels.push('2020-01-' + String(i).padStart(2, '0'));
    
    function fitAxisWidth(scale) { scale.width = 64; }

    const c1 = new Chart(document.getElementById('c1').getContext('2d'), {
      type: 'bar',
      data: { labels: labels, datasets: [{ data: [10] }] },
      options: {
        animation: false,
        layout: { autoPadding: false },
        scales: {
          x: { display: false },
          y: { afterFit: fitAxisWidth }
        }
      }
    });

    const c2 = new Chart(document.getElementById('c2').getContext('2d'), {
      type: 'line',
      data: { labels: labels, datasets: [{ data: [10] }, { type: 'bar', data: [5] }] },
      options: {
        animation: false,
        layout: { autoPadding: false },
        scales: {
          x: { display: true },
          y: { afterFit: fitAxisWidth }
        }
      }
    });

    const out = {
      c1: { left: c1.chartArea.left, right: c1.chartArea.right },
      c2: { left: c2.chartArea.left, right: c2.chartArea.right }
    };
    document.getElementById('out').textContent = JSON.stringify(out, null, 2);
    window.__OFFSET_CHECK__ = out;
  </script>
</body>
</html>
