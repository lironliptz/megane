<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Battery">
  <rect width="32" height="32" rx="6" fill="#1a1d23"/>
  <!-- Battery outline -->
  <rect x="5" y="10" width="20" height="12" rx="2" fill="none" stroke="#4f8ef7" stroke-width="2"/>
  <!-- Positive terminal -->
  <rect x="25" y="13" width="4" height="6" rx="1" fill="#4f8ef7"/>
  <!-- Charge level -->
  <rect x="8" y="13" width="4" height="6" rx="0.5" fill="#4caf7d"/>
  <rect x="13.5" y="13" width="4" height="6" rx="0.5" fill="#4caf7d"/>
  <rect x="19" y="13" width="3" height="6" rx="0.5" fill="#4f8ef7" opacity="0.45"/>
</svg>
